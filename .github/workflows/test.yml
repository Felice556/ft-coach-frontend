# A ogni push GitHub fa girare i test e controlla che l'app si compili.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Compila (TypeScript + Vite)
        run: npm run build
        env:
          VITE_API_URL: https://palestra-backend-ytp0.onrender.com
