<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sfrutta tutto lo schermo sugli iPhone con il "notch" -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colora la barra del browser sul telefono come lo sfondo dell'app -->
    <meta name="theme-color" content="#f5f5f3" />
    <!-- Tema chiaro/scuro applicato PRIMA che la pagina venga disegnata: niente "lampo" bianco
         all'apertura per chi usa il tema scuro. La stessa logica è in src/tema.ts. -->
    <script src="/tema-iniziale.js"></script>
    <!-- PWA: l'app si può aggiungere alla schermata Home e si apre a schermo intero, con la sua icona -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icona.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iPhone: icona e nome sotto l'icona quando si usa "Aggiungi a schermata Home" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FT Coach" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Le tue schede di allenamento con Felice: serie, pesi e progressi." />
    <title>FT Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
